  <text x="166" y="318" fill="#2B241B" font-size="34" font-family="Arial, sans-serif" font-weight="700">Buy strength on leaders, avoid weak bounce names.</text>
  <text x="166" y="354" fill="#6F5E4B" font-size="18" font-family="Arial, sans-serif">Banks are participating, event pressure is low, and the opportunity is in clean continuation rather than cheap-looking laggards.</text>

